plugins {
	id 'java'
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id "com.modrinth.minotaur" version "2.+"
	id 'com.matthewprenger.cursegradle' version '1.4.0'
}
version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	accessWidenerPath = file("src/main/resources/universalgraves.accesswidener")
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven { url 'https://maven.nucleoid.xyz' }
	maven { url 'https://oss.sonatype.org/content/repositories/snapshots' }
	maven { url 'https://api.modrinth.com/maven' }
	maven { url 'https://jitpack.io' }
	maven { url "https://maven.shedaniel.me/" }
	maven { url 'https://maven.wispforest.io/releases' }
	maven { url 'https://maven.su5ed.dev/releases' }
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
	}

	maven {
		name = "Ladysnake Libs"
		url = "https://maven.ladysnake.org/releases"
	}

	flatDir {
		dirs './modsWithCompat'
	}

	maven {
		name 'Gegy'
		url 'https://maven.gegy.dev'
	}

	mavenCentral()
	mavenLocal()
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"


	implementation include("com.github.x3rt:sgui:26.1-SNAPSHOT")
	implementation include("eu.pb4:placeholder-api:3.0.0-beta.1+26.1")
//	modImplementation include('xyz.nucleoid:server-translations-api:2.5.2+1.21.9-pre3')
	implementation 'com.github.x3rt.polymer:polymer-core:dev~26.1-jitpack-SNAPSHOT'
	implementation 'com.github.x3rt.polymer:polymer-resource-pack:dev~26.1-jitpack-SNAPSHOT'
	implementation 'com.github.x3rt.polymer:polymer-virtual-entity:dev~26.1-jitpack-SNAPSHOT'
	implementation include('com.github.x3rt:PredicateAPI:26.1-SNAPSHOT')
	implementation include("eu.pb4:common-protection-api:1.0.0")

//	implementation include("me.lucko:fabric-permissions-api:0.6.0-patbox")

	compileOnly "dev.emi:trinkets:3.10.0"
	compileOnly "maven.modrinth:inventorio:1.10.3+1.20.2"
	compileOnly "io.wispforest:accessories-fabric:1.4.0-beta+1.21.10"

	compileOnly "maven.modrinth:goml-reserved:1.13.1+1.21"
	compileOnly 'com.jamieswhiteshirt:rtree-3i-lite:0.3.0'
	compileOnly "org.ladysnake.cardinal-components-api:cardinal-components-base:6.1.0"

	compileOnly("com.terraformersmc:modmenu:7.2.2")

	// PSA: Some older mods, compiled on Loom 0.2.1, might have outdated Maven POMs.
	// You may need to force-disable transitiveness on them.
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	// ensure that the encoding is set to UTF-8, no matter what the system default is
	// this fixes some edge cases with special characters not displaying correctly
	// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
	// If Javadoc is generated, this must be specified in that task too.
	it.options.encoding = "UTF-8"

	// Minecraft 1.17 (21w19a) upwards uses Java 16.
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}


jar {
	inputs.property "archivesName", project.base.archivesName
	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}

	from("src/main/resources/data/universal_graves/lang") {
		into("assets/universal_graves/lang")
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

curseforge {
	if (System.getenv("CURSEFORGE")) {
		apiKey = System.getenv("CURSEFORGE")

		project {
			id = "497175"
			releaseType = "release"
			changelog = System.getenv("CHANGELOG")
			changelogType = "markdown"
			addGameVersion((project.minecraft_version.contains("-") ? ((String) project.minecraft_version.split("-")[0] + "-snapshot") : project.minecraft_version))
			addGameVersion "Fabric"
			addGameVersion "Quilt"

			relations {
				requiredDependency "polymer"
			}

			mainArtifact(jar)

			afterEvaluate {
				uploadTask.dependsOn("jar")
			}
		}
	}

	options {
		forgeGradleIntegration = false
	}

	jar {
		finalizedBy project.tasks.curseforge
	}
}

if (System.getenv("MODRINTH")) {
	modrinth {
		token = System.getenv("MODRINTH")
		projectId = 'yn9u3ypm'
		versionNumber = "" + version // The version of the mod to upload.
		uploadFile = jar // This links to a task that builds your mod jar and sets "uploadFile" to the mod jar.
		gameVersions = [((String) project.minecraft_version)]
		changelog = System.getenv("CHANGELOG")
		loaders = ["fabric"/*, "quilt"*/]
		dependencies {
			required.project "polymer"
		}
	}

	jar {
		finalizedBy project.tasks.modrinth
	}
}
